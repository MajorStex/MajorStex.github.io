name: Wolt Kandidati Android APK
on:
  push:
    branches: [main]
    paths:
      - 'wolt-kandidati/**'
      - 'wolt-android/**'
      - '.github/workflows/wolt-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use Android SDK on runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls -d /usr/local/lib/android/sdk/platforms/android-* || true
      - name: Build web files
        working-directory: wolt-android
        run: |
          npm install --no-audit --no-fund
          npm run build
          node check.mjs
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: wolt-android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: cp wolt-android/android/app/build/outputs/apk/debug/app-debug.apk Wolt-Kandidati-Android-v0.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wolt-Kandidati-Android-v0.4
          path: Wolt-Kandidati-Android-v0.4.apk
          if-no-files-found: error
      - name: Publish installable APK link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete wolt-android-v0.4 --yes 2>/dev/null || true
          gh release create wolt-android-v0.4 Wolt-Kandidati-Android-v0.4.apk \
            --title "Wolt Kandidati Android v0.4 — privatni live panel (potrebno odobrenje)" \
            --notes "Android panel sa prečicom do privatnog Google Apps Script pregleda koji zahteva jednokratno odobrenje. Meta→Sheets radi, ali APK još nema direktnu Google autorizaciju. Ne šalje WhatsApp poruke." \
            --prerelease
