name: Wolt Kandidati Android APK
on:
  push:
    branches: [main]
    paths:
      - 'wolt-android/**'
      - '.github/workflows/wolt-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use Android SDK on runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls -d /usr/local/lib/android/sdk/platforms/android-* || true
      - name: Build web files
        working-directory: wolt-android
        run: |
          npm install --no-audit --no-fund
          npm run build
          node check.mjs
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: wolt-android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Rename APK
        run: cp wolt-android/android/app/build/outputs/apk/debug/app-debug.apk Wolt-Kandidati-AUTO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wolt-Kandidati-Android-v0.5
          path: Wolt-Kandidati-AUTO.apk
          if-no-files-found: error
      - name: Publish installable APK link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete wolt-android-v0.5 --yes 2>/dev/null || true
          gh release create wolt-android-v0.5 Wolt-Kandidati-AUTO.apk \
            --title "Wolt Kandidati AUTO Android v0.5 — stalni privatni panel" \
            --notes "Nova Android aplikacija automatski otvara stalni privatni Google Apps Script Wolt panel. Prijave se čitaju iz Meta→Google Sheets, telefon/Chrome mora biti prijavljen na ovlašćeni Google nalog. Nema ručnog uvoza ni podešavanja URL-a. WhatsApp prve poruke nisu automatizovane; nijedna poruka se ne šalje iz APK." \
            --latest
